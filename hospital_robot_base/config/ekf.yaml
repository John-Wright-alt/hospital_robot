# =============================================================================
# ekf.yaml  --  robot_localization EKF: wheel odometry + MPU-6050 yaw rate
# Used only when you launch with use_ekf:=true (guide Part 8.4).
# Output: /odometry/filtered and the TF odom -> base_footprint.
# =============================================================================
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true             # flat floors: ignore z, roll, pitch
    publish_tf: true             # the EKF now owns odom -> base_footprint
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Each _config list is 15 booleans in this order:
    # [x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az]

    # Wheel odometry: trust its forward speed and turn rate. vy = 0 is also
    # true information for a differential robot (it can't slide sideways).
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # IMU: ONLY the yaw rate (Z gyro). No orientation (no magnetometer),
    # no acceleration (too noisy to integrate on an MPU-6050).
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
